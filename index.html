<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgroPulse AI — Sensorless Precision Agro-Advisory</title>
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Standalone Tailwind CDN with full extensions -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              agro: {
                400: '#34d399',
                500: '#10b981',
                600: '#059669',
              }
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            }
          }
        }
      }
    </script>
    <style>
      body {
        background: radial-gradient(circle at 50% 0%, #064e3b15 0%, #020617 70%);
        background-color: #020617;
        color: #f8fafc;
        font-family: 'Plus Jakarta Sans', sans-serif;
        min-height: 100vh;
      }
      .glass-card {
        background: rgba(15, 23, 42, 0.75);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .glass-card-hover {
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .glass-card-hover:hover {
        border-color: rgba(16, 185, 129, 0.4);
        transform: translateY(-2px);
        box-shadow: 0 12px 30px -10px rgba(16, 185, 129, 0.15);
      }
      .glow-emerald {
        box-shadow: 0 0 25px -5px rgba(16, 185, 129, 0.35);
      }
      .glow-cyan {
        box-shadow: 0 0 25px -5px rgba(6, 182, 212, 0.35);
      }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #0b1120; }
      ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
      ::-webkit-scrollbar-thumb:hover { background: #10b981; }
    </style>
  </head>
  <body class="selection:bg-emerald-500 selection:text-slate-950">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
